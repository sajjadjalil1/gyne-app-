# Publishes a browser preview of the patient app (apps/mobile) to GitHub Pages (gh-pages branch).
# It runs in demo mode with made-up patients and never calls the live server.
name: Patient app web preview

on:
  workflow_dispatch:
  push:
    branches: [main, web-preview]
    paths:
      - "apps/mobile/**"
      - "packages/core/**"
      - ".github/workflows/web-preview.yml"

permissions:
  contents: write

concurrency:
  group: web-preview
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Export web preview
        working-directory: apps/mobile
        env:
          EXPO_PUBLIC_DEMO: "1"
          EXPO_BASE_URL: /${{ github.event.repository.name }}
        run: |
          npx expo export --platform web --output-dir ../../preview
          cp ../../preview/index.html ../../preview/404.html

      - name: Publish to the gh-pages branch
        working-directory: preview
        run: |
          touch .nojekyll
          git init -q -b gh-pages
          git add -A
          git -c user.name="Sajjad Jalil" -c user.email="289023317+sajjadjalil1@users.noreply.github.com" commit -q -m "Patient app web preview from ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" gh-pages
