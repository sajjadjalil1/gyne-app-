# Opens pull requests when a library we use gets an update. Kept quiet on purpose:
#  - security fixes arrive as soon as they are published (any version);
#  - routine updates: minor/patch only, grouped, once a week for npm and once a month for the rest;
#  - big (major) version jumps are planned by hand, never opened automatically (Node stays on the 22 LTS line,
#    Expo moves with its SDK).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly, day: sunday, time: "06:00", timezone: Asia/Baghdad }
    open-pull-requests-limit: 3
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "expo*"
      - dependency-name: "@expo/*"
      - dependency-name: "react-native*"
    groups:
      server:
        patterns: ["next", "react", "react-dom", "zod", "jose", "@prisma/*", "prisma", "date-fns", "qrcode", "eslint-config-next"]
      tooling:
        patterns: ["*"]
        exclude-patterns: ["next", "react", "react-dom", "zod", "jose", "@prisma/*", "prisma", "date-fns", "qrcode", "eslint-config-next"]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /
    schedule: { interval: monthly }
    ignore:
      - dependency-name: node
        update-types: ["version-update:semver-major"]
